{% extends "base.html" %}{% block title %}ویرایش مسیر حمل‌ونقل{% endblock %}{% block header_title %}ویرایش اطلاعات مسیر{% endblock %}{% block content %}<div class="max-w-2xl mx-auto">    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">        <!-- توجه کنید که متد فرم POST است -->        <form method="POST" class="space-y-5">            <div>                <label class="block text-xs font-medium text-slate-700 mb-1">مبدا (انبار / موقعیت)</label>                <!-- قرار دادن مقدار فعلی در ویژگی value -->                <input type="text" name="origin" value="{{ route.origin }}" required class="w-full px-3 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">            </div>                        <div>                <label class="block text-xs font-medium text-slate-700 mb-1">مقصد</label>                <input type="text" name="destination" value="{{ route.destination }}" required class="w-full px-3 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">            </div>                        <div class="grid grid-cols-2 gap-4">                <div>                    <label class="block text-xs font-medium text-slate-700 mb-1">خودروی ناوگان</label>                    <select name="vehicle_id" required class="w-full px-3 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">                        {% for vehicle in vehicles %}                            <option value="{{ vehicle.id }}" {% if vehicle.id == route.vehicle_id %}selected{% endif %}>                                {{ vehicle.model_name }} ({{ vehicle.plate_number }})                            </option>                        {% endfor %}                    </select>                </div>                <div>                    <label class="block text-xs font-medium text-slate-700 mb-1">راننده مسئول</label>                    <select name="driver_id" required class="w-full px-3 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">                        {% for driver in drivers %}                            <option value="{{ driver.id }}" {% if driver.id == route.driver_id %}selected{% endif %}>                                {{ driver.name }}                            </option>                        {% endfor %}                    </select>                </div>            </div>                        <div class="pt-4 flex items-center space-x-3 space-x-reverse">                <button type="submit" class="py-2.5 px-6 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition shadow-sm">ذخیره تغییرات</button>                <a href="{{ url_for('list_routes') }}" class="py-2.5 px-6 bg-white text-slate-600 text-sm font-medium rounded-lg border border-slate-200 hover:bg-slate-50 transition text-center">انصراف</a>            </div>        </form>    </div></div>{% endblock %}
