{% extends "base.html" %}{% block title %}ثبت تراکنش انبار{% endblock %}{% block header_title %}ثبت ورود یا خروج کالا (Transaction){% endblock %}{% block content %}<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-slate-100 p-8">    <form method="POST" class="space-y-6">        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">نوع تراکنش</label>            <select name="transaction_type" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm bg-white">                <option value="INBOUND">ورود به انبار (Inbound / خرید یا رسید)</option>                <option value="OUTBOUND">خروج از انبار (Outbound / فروش یا ارسال)</option>            </select>        </div>        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">انتخاب کالا</label>            <select name="product_id" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm bg-white">                {% for p in products %}                <option value="{{ p.id }}">{{ p.name }} (SKU: {{ p.sku }})</option>                {% endfor %}            </select>        </div>        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">انتخاب انبار</label>            <select name="warehouse_id" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm bg-white">                {% for w in warehouses %}                <option value="{{ w.id }}">{{ w.location }} (ظرفیت: {{ w.capacity }})</option>                {% endfor %}            </select>        </div>        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">تعداد / مقدار</label>            <input type="number" name="change_amount" min="1" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm" placeholder="مثلا 10">        </div>        <div class="flex justify-end space-x-4 space-x-reverse pt-4">            <a href="/reports" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">انصراف</a>            <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition">ثبت تراکنش و اعمال در موجودی</button>        </div>    </form></div>{% endblock %}
