{% extends "base.html" %}{% block title %}افزودن مشتری جدید{% endblock %}{% block header_title %}ثبت مشتری جدید{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <h2 class="text-lg font-bold text-slate-800 mb-6 text-right">مشخصات مشتری جدید</h2>    <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">نام و نام خانوادگی</label>            <input type="text" name="name" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right" placeholder="مثال: علی احمدی">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">تلفن تماس</label>            <input type="text" name="phone" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right" placeholder="مثال: 09123456789">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">پست الکترونیک</label>            <input type="email" name="email" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right" placeholder="مثال: example@domain.com">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">آدرس</label>            <textarea name="address" rows="3" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right" placeholder="آدرس پستی"></textarea>        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">ثبت مشتری</button>            <a href="{{ url_for('list_customers') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">انصراف</a>        </div>    </form></div>{% endblock %}
