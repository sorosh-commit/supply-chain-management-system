{% extends "base.html" %}{% block title %}ویرایش محصول{% endblock %}{% block header_title %}ویرایش اطلاعات محصول{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <h2 class="text-lg font-bold text-slate-800 mb-6 text-right">ویرایش مشخصات کالا</h2>    <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">نام محصول</label>            <input type="text" name="name" value="{{ product.name }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">قیمت (تومان)</label>            <input type="number" name="price" value="{{ product.price }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">موجودی انبار</label>            <input type="number" name="stock" value="{{ product.stock }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">ذخیره تغییرات</button>            <a href="{{ url_for('list_products') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">انصراف</a>        </div>    </form></div>{% endblock %}
