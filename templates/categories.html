{% extends "base.html" %}{% block title %}مدیریت دسته‌بندی‌ها{% endblock %}{% block header_title %}دسته‌بندی محصولات{% endblock %}{% block content %}<div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6">    <!-- فرم افزودن دسته‌بندی جدید -->    <form method="POST" class="flex gap-3 mb-6">        <input type="text" name="name" placeholder="نام دسته‌بندی جدید..." required                class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-right">        <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition">            افزودن        </button>    </form>    <!-- جدول لیست دسته‌بندی‌ها -->    <div class="overflow-x-auto">        <table class="w-full text-right text-sm border-collapse">            <thead>                <tr class="bg-slate-50 text-slate-600 border-b border-slate-100">                    <th class="p-3">#</th>                    <th class="p-3">نام دسته‌بندی</th>                </tr>            </thead>            <tbody class="divide-y divide-slate-100 text-slate-700">                {% for cat in categories %}                <tr class="hover:bg-slate-50 transition">                    <td class="p-3 font-mono text-xs">{{ loop.index }}</td>                    <td class="p-3 font-medium text-slate-800">{{ cat.name }}</td>                </tr>                {% else %}                <tr>                    <td colspan="2" class="p-6 text-center text-slate-400">هیچ دسته‌بندی‌ای ثبت نشده است.</td>                </tr>                {% endfor %}            </tbody>        </table>    </div></div>{% endblock %}
