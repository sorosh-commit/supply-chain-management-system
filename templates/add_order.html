{% extends "base.html" %}{% block title %}ثبت سفارش جدید{% endblock %}{% block header_title %}ایجاد سفارش مشتری{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <h2 class="text-lg font-bold text-slate-800 mb-6 text-right">فرم ثبت سفارش جدید</h2>    <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">انتخاب مشتری</label>            <select name="customer_id" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">                {% for c in customers %}                <option value="{{ c.id }}">{{ c.name }} ({{ c.phone }})</option>                {% endfor %}            </select>        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">انتخاب کالا</label>            <select name="product_id" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">                {% for p in products %}                <option value="{{ p.id }}">{{ p.name }} - قیمت: {{ "{:,.0f}".format(p.price) }} تومان</option>                {% endfor %}            </select>        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">تعداد</label>            <input type="number" name="quantity" value="1" min="1" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right">        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">ثبت سفارش و صدور فاکتور</button>            <a href="{{ url_for('list_orders') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">انصراف</a>        </div>    </form></div>{% endblock %}
