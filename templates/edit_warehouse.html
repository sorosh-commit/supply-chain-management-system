{% extends "base.html" %}{% block title %}ویرایش انبار{% endblock %}{% block header_title %}ویرایش اطلاعات انبار{% endblock %}{% block content %}<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-sm border border-slate-200">    <form method="POST" class="space-y-6">        <div>            <label class="block text-sm font-semibold text-slate-700 mb-2">نام انبار</label>            <input type="text" name="name" value="{{ warehouse.name }}" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">        </div>        <div>            <label class="block text-sm font-semibold text-slate-700 mb-2">موقعیت (آدرس یا شهر)</label>            <input type="text" name="location" value="{{ warehouse.location }}" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">        </div>        <div>            <label class="block text-sm font-semibold text-slate-700 mb-2">ظرفیت کل انبار</label>            <input type="number" name="capacity" value="{{ warehouse.capacity }}" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">        </div>        <div class="flex items-center gap-3 pt-4">            <button type="submit" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-medium rounded-lg text-sm transition shadow-sm">                بروزرسانی اطلاعات            </button>            <a href="{{ url_for('list_warehouses') }}" class="px-5 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-lg text-sm transition">                بازگشت            </a>        </div>    </form></div>{% endblock %}
