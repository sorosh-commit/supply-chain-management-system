{% extends "base.html" %}{% block title %}ویرایش خودرو{% endblock %}{% block header_title %}ویرایش مشخصات خودرو{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">مدل خودرو</label>            <input type="text" name="model_name" value="{{ vehicle.model_name }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">شماره پلاک</label>            <input type="text" name="plate_number" value="{{ vehicle.plate_number }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">ظرفیت (کیلوگرم)</label>            <input type="number" step="any" name="capacity" value="{{ vehicle.capacity }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">وضعیت</label>            <input type="text" name="status" value="{{ vehicle.status }}" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-right">        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition">ذخیره تغییرات</button>            <a href="{{ url_for('list_vehicles') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">انصراف</a>        </div>    </form></div>{% endblock %}
