{% extends "base.html" %}{% block title %}افزودن کالای جدید{% endblock %}{% block header_title %}ثبت کالای جدید در سیستم{% endblock %}{% block content %}<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border border-slate-100 p-8">    <form method="POST" class="space-y-6">        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">نام کالا</label>            <input type="text" name="name" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm">        </div>                <div>            <label class="block text-sm font-medium text-slate-700 mb-2">شناسه انحصاری (SKU)</label>            <input type="text" name="sku" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm font-mono">        </div>        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">قیمت (تومان)</label>            <input type="number" step="0.01" name="price" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm">        </div>        <div>            <label class="block text-sm font-medium text-slate-700 mb-2">تأمین‌کننده</label>            <select name="supplier_id" required class="w-full px-4 py-2.5 rounded-lg border border-slate-200 focus:outline-none focus:border-indigo-600 text-sm bg-white">                {% for supplier in suppliers %}                <option value="{{ supplier.id }}">{{ supplier.name }}</option>                {% endfor %}            </select>        </div>        <div class="flex justify-end space-x-4 space-x-reverse pt-4">            <a href="/products" class="px-5 py-2.5 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition">انصراف</a>            <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 transition">ثبت و ذخیره کالا</button>        </div>    </form></div>{% endblock %}
