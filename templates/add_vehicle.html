{% extends "base.html" %}{% block title %}افزودن خودروی جدید{% endblock %}{% block header_title %}افزودن خودروی جدید{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <h2 class="text-lg font-bold text-slate-800 mb-6 text-right">افزودن خودروی ناوگان جدید</h2>        <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">مدل خودرو</label>            <input type="text" name="model_name" required                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right"                   placeholder="مثال: ایسوزو ۶ تن">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">شماره پلاک</label>            <input type="text" name="plate_number" required                    class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right"                   placeholder="مثال: ۱۲الف۳۴۵-تهران">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">ظرفیت (تن / کیلوگرم)</label>            <input type="number" name="capacity" required                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition text-right"                   placeholder="مثال: 6000">        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">                ثبت خودرو            </button>            <a href="{{ url_for('list_vehicles') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">                انصراف            </a>        </div>    </form></div>{% endblock %}
