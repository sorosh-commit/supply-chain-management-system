{% extends "base.html" %}{% block title %}ویرایش اطلاعات راننده{% endblock %}{% block header_title %}ویرایش راننده{% endblock %}{% block content %}<div class="max-w-xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-8">    <h2 class="text-lg font-bold text-slate-800 mb-6 text-right">ویرایش مشخصات راننده</h2>    <form method="POST" class="space-y-5">        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">نام و نام خانوادگی</label>            <input type="text" name="name" value="{{ driver.name }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">شماره گواهینامه</label>            <input type="text" name="license_number" value="{{ driver.license_number }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div>            <label class="block text-xs font-medium text-slate-700 mb-1.5 text-right">تلفن تماس</label>            <input type="text" name="phone" value="{{ driver.phone }}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-right">        </div>        <div class="flex space-x-3 space-x-reverse pt-4">            <button type="submit" class="px-5 py-2.5 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm">ذخیره تغییرات</button>            <a href="{{ url_for('list_drivers') }}" class="px-5 py-2.5 bg-white text-slate-600 border border-slate-300 text-xs font-medium rounded-xl hover:bg-slate-50 transition">انصراف</a>        </div>    </form></div>{% endblock %}
