<!DOCTYPE html><html lang="fa" dir="rtl"><head>    <meta charset="UTF-8">    <title>ثبت‌نام در سامانه لجستیک</title>    <script src="https://cdn.tailwindcss.com"></script>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">    <style>body { font-family: 'Vazirmatn', sans-serif; }</style></head><body class="bg-slate-900 flex items-center justify-center min-h-screen">    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">        <div class="text-center mb-8">            <div class="inline-flex p-3 bg-indigo-50 text-indigo-600 rounded-2xl mb-3">                <i class="fa-solid fa-user-plus text-2xl"></i>            </div>            <h2 class="text-2xl font-bold text-slate-800">ایجاد حساب کاربری</h2>            <p class="text-xs text-slate-500 mt-1">مشخصات خود را برای ثبت‌نام در سامانه وارد کنید</p>        </div>       <!-- Flash messages notification container -->        {% with messages = get_flashed_messages(with_categories=true) %}          {% if messages %}            {% for category, message in messages %}              <div class="mb-4 p-3 text-xs bg-emerald-50 text-emerald-600 rounded-lg border border-emerald-100 flex items-center">                  <i class="fa-solid fa-circle-check ml-2"></i> {{ message }}              </div>            {% endfor %}          {% endif %}        {% endwith %}        <form method="POST" class="space-y-4">            <div>                <label class="block text-xs font-medium text-slate-700 mb-1">نام کاربری</label>                <div class="relative">                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">                        <i class="fa-solid fa-user text-xs"></i>                    </span>                    <input type="text" name="username" required autocomplete="username" class="w-full pr-9 pl-3 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">                </div>            </div>            <div>                <label class="block text-xs font-medium text-slate-700 mb-1">رمز عبور</label>                <div class="relative">                    <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400">                        <i class="fa-solid fa-lock text-xs"></i>                    </span>                    <input type="password" id="password" name="password" required autocomplete="new-password" class="w-full pr-9 pl-10 py-2 bg-white text-slate-800 rounded-lg border border-slate-200 text-sm focus:outline-none focus:border-indigo-600 transition">                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 hover:text-slate-600 focus:outline-none">                        <i id="eye-icon" class="fa-solid fa-eye text-xs"></i>                    </button>                </div>            </div>            <button type="submit" class="w-full py-2.5 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition shadow-sm">ثبت‌نام در سامانه</button>        </form>        <div class="text-center mt-6">            <p class="text-xs text-slate-500">حساب کاربری دارید؟ <a href="{{ url_for('login') }}" class="text-indigo-600 font-medium hover:underline">وارد شوید</a></p>        </div>    </div>    <script>        function togglePassword() {            const passwordInput = document.getElementById('password');            const eyeIcon = document.getElementById('eye-icon');            if (passwordInput.type === 'password') {                passwordInput.type = 'text';                eyeIcon.classList.remove('fa-eye');                eyeIcon.classList.add('fa-eye-slash');            } else {                passwordInput.type = 'password';                eyeIcon.classList.remove('fa-eye-slash');                eyeIcon.classList.add('fa-eye');            }        }    </script></body></html>
